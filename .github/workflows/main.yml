{
"name": "Ilan Takip",
"on": {"schedule": [{"cron": "0 */3 * * *"}], "workflow_dispatch": {}},
"permissions": {"contents": "write"},
"jobs": {"tara": {"runs-on": "ubuntu-latest", "steps": [
{"uses": "actions/checkout@v4"},
{"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}},
{"run": "pip install -r requirements.txt"},
{"name": "Ilanlari tara", "env": {"GMAIL_USER": "${{ secrets.GMAIL_USER }}", "GMAIL_APP_PASSWORD": "${{ secrets.GMAIL_APP_PASSWORD }}", "MAIL_TO": "${{ secrets.MAIL_TO }}"}, "run": "python monitor.py"},
{"name": "Gorulenleri kaydet", "run": "git config user.name ilan-bot\ngit config user.email ilan-bot@users.noreply.github.com\ngit add seen.json\ngit diff --staged --quiet || git commit -m 'seen guncellendi'\ngit push"}
]}}
}
